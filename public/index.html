<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      SIN data-i18n, a propósito. El título lo gobierna el código
      (`setTituloResultados()` en js/dom.js), que le añade el número de
      resultados: "(42) URL Explorer". `traducirDocumento()` recorre todo
      [data-i18n] en cada cambio de idioma, así que marcarlo aquí borraría
      ese número cada vez que alguien tocase el selector de idioma.
    -->
    <title>URL Explorer</title>
    <meta name="description" content="Explorador de enlaces y recursos multimedia de sitios web." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/styles/main.css" />

    <!--
      Favicons. Llevan una placa clara HORNEADA en la propia imagen, a
      diferencia del logo de la cabecera, que va transparente: el arte es
      azul marino y sobre la pestaña de un navegador en tema oscuro quedaría
      casi invisible. La pestaña no es nuestra, así que no se puede resolver
      con CSS.
    -->
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="app.saltar">Saltar al contenido</a>

    <div class="layout">
      <header class="topbar">
        <div class="topbar__brand">
          <!--
            OJO: `.topbar__mark` es el objetivo del gesto oculto que desbloquea
            el modo admin (cinco pulsaciones en menos de dos segundos, ver
            js/admin.js). La clase debe seguir AQUÍ, en el contenedor: los
            clics sobre la imagen burbujean hasta él. Si se quita la clase o se
            mueve al <img>, se pierde la única forma de entrar al modo admin.
          -->
          <span class="topbar__mark" aria-hidden="true">
            <img class="topbar__logo" src="/img/logo.png" alt="" width="36" height="36" />
          </span>
          <div>
            <h1 class="topbar__title">URL Explorer</h1>
            <p class="topbar__subtitle" data-i18n="app.subtitulo">
              Explora enlaces y recursos de un sitio
            </p>
          </div>
        </div>

        <nav
          class="tabs"
          data-i18n="nav.aria"
          data-i18n-attr="aria-label"
          aria-label="Herramientas"
        >
          <button class="tab" data-view="explorer" type="button" aria-current="page">
            <span aria-hidden="true">🔗</span>
            <span class="tab__label" data-i18n="nav.explorador">Explorador</span>
          </button>
          <button class="tab" data-view="video" type="button">
            <span aria-hidden="true">🎬</span>
            <span class="tab__label" data-i18n="nav.videos">Vídeos</span>
          </button>
        </nav>

        <!--
          Controles de la cabecera, agrupados a la derecha.

          El selector de idioma y el de tema viven JUNTOS y fuera de
          `.topbar__brand` a propósito: `.topbar__mark` es el objetivo del
          gesto oculto de admin (cinco clics), así que nada clicable puede
          acabar dentro de él ni cerca, o los clics se repartirían y el gesto
          dejaría de dispararse.
        -->
        <div class="topbar__controls">
          <div
            class="langswitch"
            role="group"
            data-i18n="idioma.aria"
            data-i18n-attr="aria-label"
            aria-label="Idioma"
          >
            <button class="langswitch__option" type="button" data-lang="es">ES</button>
            <button class="langswitch__option" type="button" data-lang="en">EN</button>
          </div>

          <button
            class="icon-button"
            id="theme-toggle"
            type="button"
            data-i18n="tema.cambiar"
            data-i18n-attr="aria-label,title"
            aria-label="Cambiar tema"
            title="Cambiar tema"
          >
            <span aria-hidden="true">◐</span>
          </button>
        </div>
      </header>

      <main id="main" class="main">
        <section id="view-explorer" class="view" aria-labelledby="explorer-heading"></section>
        <section id="view-video" class="view" hidden aria-labelledby="video-heading"></section>
      </main>

      <footer class="footer">
        <span
          id="health-indicator"
          class="status-dot status-dot--unknown"
          aria-hidden="true"
        ></span>
        <span id="health-text" data-i18n="salud.comprobando">Comprobando servicio…</span>
      </footer>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
