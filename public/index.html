<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Explorer</title>
    <meta name="description" content="Explorador de enlaces y recursos multimedia de sitios web." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>"
    />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <div class="layout">
      <header class="topbar">
        <div class="topbar__brand">
          <span class="topbar__mark" aria-hidden="true">◎</span>
          <div>
            <h1 class="topbar__title">URL Explorer</h1>
            <p class="topbar__subtitle">Explora enlaces y recursos de un sitio</p>
          </div>
        </div>

        <nav class="tabs" aria-label="Herramientas">
          <button class="tab" data-view="explorer" type="button" aria-current="page">
            <span aria-hidden="true">🔗</span> Explorador
          </button>
          <button class="tab" data-view="video" type="button">
            <span aria-hidden="true">🎬</span> Videos
          </button>
        </nav>

        <button
          class="icon-button"
          id="theme-toggle"
          type="button"
          aria-label="Cambiar tema"
          title="Cambiar tema"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <main id="main" class="main">
        <section id="view-explorer" class="view" aria-labelledby="explorer-heading"></section>
        <section id="view-video" class="view" hidden aria-labelledby="video-heading"></section>
      </main>

      <footer class="footer">
        <span
          id="health-indicator"
          class="status-dot status-dot--unknown"
          aria-hidden="true"
        ></span>
        <span id="health-text">Comprobando servicio…</span>
      </footer>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
