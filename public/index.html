<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Explorer</title>
    <meta name="description" content="Explorador de enlaces y recursos multimedia de sitios web." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="/styles/main.css" />

    <!--
      Favicons. Llevan una placa clara HORNEADA en la propia imagen, a
      diferencia del logo de la cabecera, que va transparente: el arte es
      azul marino y sobre la pestaña de un navegador en tema oscuro quedaría
      casi invisible. La pestaña no es nuestra, así que no se puede resolver
      con CSS.
    -->
    <link rel="icon" href="/img/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16.png" />
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <div class="layout">
      <header class="topbar">
        <div class="topbar__brand">
          <!--
            OJO: `.topbar__mark` es el objetivo del gesto oculto que desbloquea
            el modo admin (cinco pulsaciones en menos de dos segundos, ver
            js/admin.js). La clase debe seguir AQUÍ, en el contenedor: los
            clics sobre la imagen burbujean hasta él. Si se quita la clase o se
            mueve al <img>, se pierde la única forma de entrar al modo admin.
          -->
          <span class="topbar__mark" aria-hidden="true">
            <img class="topbar__logo" src="/img/logo.png" alt="" width="36" height="36" />
          </span>
          <div>
            <h1 class="topbar__title">URL Explorer</h1>
            <p class="topbar__subtitle">Explora enlaces y recursos de un sitio</p>
          </div>
        </div>

        <nav class="tabs" aria-label="Herramientas">
          <button class="tab" data-view="explorer" type="button" aria-current="page">
            <span aria-hidden="true">🔗</span> Explorador
          </button>
          <button class="tab" data-view="video" type="button">
            <span aria-hidden="true">🎬</span> Videos
          </button>
        </nav>

        <button
          class="icon-button"
          id="theme-toggle"
          type="button"
          aria-label="Cambiar tema"
          title="Cambiar tema"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </header>

      <main id="main" class="main">
        <section id="view-explorer" class="view" aria-labelledby="explorer-heading"></section>
        <section id="view-video" class="view" hidden aria-labelledby="video-heading"></section>
      </main>

      <footer class="footer">
        <span
          id="health-indicator"
          class="status-dot status-dot--unknown"
          aria-hidden="true"
        ></span>
        <span id="health-text">Comprobando servicio…</span>
      </footer>
    </div>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
